<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Omah</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap');

        :root {
            --chocolate: #1C1210;
            --gold: #D4AF37;
            --beige: #F9F6F0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden; /* Prevent native scrolling */
            touch-action: pan-y;
        }

        /* ----- Password Screen ----- */
        #gate-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0A0706;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.2s ease, visibility 1.2s;
        }

        #gate-screen.unlocked {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gate-content {
            text-align: center;
            padding: 50px 40px;
            background: rgba(28, 18, 16, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(15px);
            max-width: 90%;
            width: 320px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--gold);
            font-weight: 400;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--beige);
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0.6;
        }

        input[type="password"] {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold);
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 10px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.4s;
            font-family: 'DM Sans', sans-serif;
        }

        input[type="password"]:focus {
            border-bottom-color: var(--gold);
        }

        button.unlock-btn {
            margin-top: 40px;
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 15px 40px;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s;
            text-transform: uppercase;
            letter-spacing: 3px;
            width: 100%;
        }

        button.unlock-btn:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            height: 15px;
        }

        /* ----- Flipbook / Slider ----- */
        #magazine-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease 0.8s; /* Fade in smoothly */
        }

        #magazine-container.active {
            opacity: 1;
            visibility: visible;
        }

        .slider-track {
            display: flex;
            height: 100%;
            width: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .slide {
            min-width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: #000;
        }

        /* Make portrait pages look perfect on phones */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ----- Navigation ----- */
        .nav-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(249, 246, 240, 0.4);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            color: rgba(212, 175, 55, 0.5);
            border: none;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: color 0.3s, opacity 0.3s;
        }

        .nav-btn:hover {
            color: rgba(212, 175, 55, 1);
        }
        
        .nav-btn:disabled {
            opacity: 0;
            cursor: not-allowed;
        }

        .nav-prev { left: 10px; }
        .nav-next { right: 10px; }

        .nav-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .nav-btn { display: none; } /* On portrait phone, use swipe only */
        }
    </style>
</head>
<body>

    <!-- Password Screen -->
    <div id="gate-screen">
        <div class="gate-content">
            <h1>For Omah</h1>
            <p class="subtitle">A Celebration of Grace</p>
            <input type="password" id="passcode" placeholder="Passcode" maxlength="10">
            <div class="error-msg" id="error-msg">Incorrect Passcode</div>
            <button class="unlock-btn" id="unlock-btn">Unlock</button>
        </div>
    </div>

    <!-- Flipbook Screen -->
    <div id="magazine-container">
        
        <button class="nav-btn nav-prev" id="prev-btn" disabled>
            <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
        </button>
        <button class="nav-btn nav-next" id="next-btn">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
        </button>

        <div class="slider-track" id="slider-track">
            <!-- Images generated sequentially (0 to 43) -->
        </div>

        <div class="nav-hint" id="nav-hint">
            <span>&larr;</span> Swipe <span>&rarr;</span>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const CORRECT_PASSCODE = "1507"; 
        const TOTAL_SPREADS = 44; 
        
        // --- 1. Passcode Logic ---
        const gateScreen = document.getElementById('gate-screen');
        const magContainer = document.getElementById('magazine-container');
        const passInput = document.getElementById('passcode');
        const unlockBtn = document.getElementById('unlock-btn');
        const errorMsg = document.getElementById('error-msg');
        const navHint = document.getElementById('nav-hint');

        function checkPasscode() {
            if (passInput.value === CORRECT_PASSCODE) {
                gateScreen.classList.add('unlocked');
                magContainer.classList.add('active');
                loadImages();
                
                // Hide swipe hint after 5 seconds
                setTimeout(() => {
                    navHint.style.opacity = '0';
                    navHint.style.transition = 'opacity 1s ease';
                }, 5000);
            } else {
                errorMsg.style.opacity = '1';
                passInput.value = '';
                setTimeout(() => errorMsg.style.opacity = '0', 2000);
            }
        }

        unlockBtn.addEventListener('click', checkPasscode);
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPasscode();
        });

        // --- 2. Slider Logic ---
        const track = document.getElementById('slider-track');
        let currentIndex = 0;
        let imagesLoaded = false;

        function loadImages() {
            if (imagesLoaded) return;
            for (let i = 0; i < TOTAL_SPREADS; i++) {
                const slide = document.createElement('div');
                slide.className = 'slide';
                const img = document.createElement('img');
                img.src = `assets/omah/digi_spread_${i}.jpg`;
                slide.appendChild(img);
                track.appendChild(slide);
            }
            imagesLoaded = true;
            updateSlider();
        }

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateSlider() {
            track.style.transform = `translateX(-${currentIndex * 100}vw)`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === TOTAL_SPREADS - 1;
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < TOTAL_SPREADS - 1) {
                currentIndex++;
                updateSlider();
            }
        });

        // --- 3. Swipe Support (Touch) ---
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none'; 
        }, {passive: true});

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diffX = currentX - startX;
            let dragPx = diffX;
            if (currentIndex === 0 && diffX > 0) dragPx = diffX * 0.2;
            if (currentIndex === TOTAL_SPREADS - 1 && diffX < 0) dragPx = diffX * 0.2;
            
            const baseTranslate = -currentIndex * window.innerWidth;
            track.style.transform = `translateX(${baseTranslate + dragPx}px)`;
        }, {passive: true});

        track.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            track.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
            
            const endX = e.changedTouches[0].clientX;
            const diffX = endX - startX;
            
            if (diffX < -40 && currentIndex < TOTAL_SPREADS - 1) {
                currentIndex++;
            } else if (diffX > 40 && currentIndex > 0) {
                currentIndex--;
            }
            updateSlider();
        });
        
        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (gateScreen.classList.contains('unlocked')) {
                if (e.key === 'ArrowRight' && currentIndex < TOTAL_SPREADS - 1) {
                    currentIndex++;
                    updateSlider();
                } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    currentIndex--;
                    updateSlider();
                }
            }
        });
    </script>
</body>
</html>
