<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Omah</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --chocolate: #2E1A14;
            --gold: #C49A6C;
            --beige: #F5F0E6;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--chocolate);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; /* Prevent native scrolling */
            touch-action: pan-y;
        }

        /* ----- Password Screen ----- */
        #gate-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1A0F0C 0%, #3D231B 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #gate-screen.unlocked {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gate-content {
            text-align: center;
            padding: 40px;
            background: rgba(46, 26, 20, 0.6);
            border: 1px solid var(--gold);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 320px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-weight: 400;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--beige);
            font-size: 0.9rem;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        input[type="password"] {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 0;
            border-bottom: 2px solid rgba(196, 154, 108, 0.5);
            color: var(--beige);
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            border-bottom-color: var(--gold);
        }

        button.unlock-btn {
            margin-top: 30px;
            background: var(--gold);
            color: var(--chocolate);
            border: none;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 100%;
        }

        button.unlock-btn:active {
            transform: scale(0.95);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            height: 15px;
        }

        /* ----- Flipbook / Slider ----- */
        #magazine-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease 0.5s;
        }

        #magazine-container.active {
            opacity: 1;
            visibility: visible;
        }

        .slider-track {
            display: flex;
            height: 100%;
            width: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .slide {
            min-width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 4px;
        }

        /* ----- Navigation ----- */
        .nav-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(245, 240, 230, 0.6);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(196, 154, 108, 0.2);
            color: var(--gold);
            border: 1px solid rgba(196, 154, 108, 0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(5px);
            transition: background 0.3s, opacity 0.3s;
        }

        .nav-btn:hover {
            background: rgba(196, 154, 108, 0.5);
        }
        
        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Landscape hint for mobile */
        #rotate-device {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold);
            color: var(--chocolate);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            white-space: nowrap;
        }

        @media (orientation: portrait) {
            #rotate-device { opacity: 0.9; }
            .nav-btn { display: none; } /* On portrait phone, use swipe only */
        }
    </style>
</head>
<body>

    <!-- Password Screen -->
    <div id="gate-screen">
        <div class="gate-content">
            <h1>For Omah</h1>
            <p class="subtitle">A Celebration of Grace</p>
            <input type="password" id="passcode" placeholder="Passcode" maxlength="10">
            <div class="error-msg" id="error-msg">Incorrect Passcode</div>
            <button class="unlock-btn" id="unlock-btn">Unlock</button>
        </div>
    </div>

    <!-- Flipbook Screen -->
    <div id="magazine-container">
        <div id="rotate-device">Rotate device for best view</div>
        
        <button class="nav-btn nav-prev" id="prev-btn" disabled>
            <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
        </button>
        <button class="nav-btn nav-next" id="next-btn">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
        </button>

        <div class="slider-track" id="slider-track">
            <!-- Images generated sequentially (0 to 22) -->
            <!-- We will inject them via JS -->
        </div>

        <div class="nav-hint">
            <span>&larr;</span> Swipe <span>&rarr;</span>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const CORRECT_PASSCODE = "1507"; // Default: October 10
        const TOTAL_SPREADS = 23; // 0 to 22
        
        // --- 1. Passcode Logic ---
        const gateScreen = document.getElementById('gate-screen');
        const magContainer = document.getElementById('magazine-container');
        const passInput = document.getElementById('passcode');
        const unlockBtn = document.getElementById('unlock-btn');
        const errorMsg = document.getElementById('error-msg');

        function checkPasscode() {
            if (passInput.value === CORRECT_PASSCODE) {
                gateScreen.classList.add('unlocked');
                magContainer.classList.add('active');
                loadImages(); // Lazy load images only after unlock
            } else {
                errorMsg.style.opacity = '1';
                passInput.value = '';
                setTimeout(() => errorMsg.style.opacity = '0', 2000);
            }
        }

        unlockBtn.addEventListener('click', checkPasscode);
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPasscode();
        });

        // --- 2. Slider Logic ---
        const track = document.getElementById('slider-track');
        let currentIndex = 0;
        let imagesLoaded = false;

        function loadImages() {
            if (imagesLoaded) return;
            for (let i = 0; i < TOTAL_SPREADS; i++) {
                const slide = document.createElement('div');
                slide.className = 'slide';
                const img = document.createElement('img');
                img.src = `assets/omah/digi_spread_${i}.jpg`;
                slide.appendChild(img);
                track.appendChild(slide);
            }
            imagesLoaded = true;
            updateSlider();
        }

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateSlider() {
            track.style.transform = `translateX(-${currentIndex * 100}vw)`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === TOTAL_SPREADS - 1;
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < TOTAL_SPREADS - 1) {
                currentIndex++;
                updateSlider();
            }
        });

        // --- 3. Swipe Support (Touch) ---
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none'; // remove transition for smooth dragging
        }, {passive: true});

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diffX = currentX - startX;
            // Add resistance at edges
            let dragPx = diffX;
            if (currentIndex === 0 && diffX > 0) dragPx = diffX * 0.2;
            if (currentIndex === TOTAL_SPREADS - 1 && diffX < 0) dragPx = diffX * 0.2;
            
            const baseTranslate = -currentIndex * window.innerWidth;
            track.style.transform = `translateX(${baseTranslate + dragPx}px)`;
        }, {passive: true});

        track.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            track.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
            
            const endX = e.changedTouches[0].clientX;
            const diffX = endX - startX;
            
            // Threshold for swipe
            if (diffX < -50 && currentIndex < TOTAL_SPREADS - 1) {
                currentIndex++;
            } else if (diffX > 50 && currentIndex > 0) {
                currentIndex--;
            }
            updateSlider();
        });
        
        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (gateScreen.classList.contains('unlocked')) {
                if (e.key === 'ArrowRight' && currentIndex < TOTAL_SPREADS - 1) {
                    currentIndex++;
                    updateSlider();
                } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    currentIndex--;
                    updateSlider();
                }
            }
        });
    </script>
</body>
</html>
