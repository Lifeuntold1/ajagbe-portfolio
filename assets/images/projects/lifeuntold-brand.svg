<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" fill="#0C0C0C"/>
  <rect x="20" y="20" width="760" height="460" stroke="#222222" stroke-width="1"/>
  <rect x="28" y="28" width="744" height="444" stroke="#181818" stroke-width="1"/>
  
  <!-- Subtle flat grid marks -->
  <line x1="400" y1="28" x2="400" y2="472" stroke="#222222" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="28" y1="250" x2="772" y2="250" stroke="#222222" stroke-width="1" stroke-dasharray="4 6"/>
  
  <!-- Corner registration ticks -->
  <path d="M 40 40 L 55 40 M 47.5 32.5 L 47.5 47.5" stroke="#888888" stroke-width="1"/>
  <path d="M 745 40 L 760 40 M 752.5 32.5 L 752.5 47.5" stroke="#888888" stroke-width="1"/>
  <path d="M 40 460 L 55 460 M 47.5 452.5 L 47.5 467.5" stroke="#888888" stroke-width="1"/>
  <path d="M 745 460 L 760 460 M 752.5 452.5 L 752.5 467.5" stroke="#888888" stroke-width="1"/>

  <!-- Brand Typography -->
  <text x="400" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#D4FF3A" letter-spacing="3">MEDIA BRAND &amp; IDENTITY SYSTEM</text>
  <text x="400" y="215" text-anchor="middle" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-weight="800" font-size="52" fill="#F5F5F0" letter-spacing="-1.5">LIFE UNTOLD</text>
  <text x="400" y="260" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-weight="400" font-size="18" fill="#888888">Independent Storytelling &amp; Strategic Brand Architecture</text>

  <!-- Editorial emblem graphic -->
  <rect x="360" y="290" width="80" height="2" fill="#D4FF3A"/>
  
  <text x="400" y="340" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#888888" letter-spacing="1">ESTABLISHED 2017 · JOS, NIGERIA</text>
  <text x="400" y="365" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D4FF3A">THE HEALING SERIES · ESSAYS · EDITORIAL DESIGN</text>

  <!-- Bottom Telemetry -->
  <line x1="50" y1="420" x2="750" y2="420" stroke="#222222" stroke-width="1"/>
  <text x="50" y="445" font-family="'JetBrains Mono', monospace" font-size="10" fill="#888888">ARCHITECTURE: BRAND IDENTITY</text>
  <text x="750" y="445" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#888888">ACTIVE: 2017 &ndash; PRESENT</text>
