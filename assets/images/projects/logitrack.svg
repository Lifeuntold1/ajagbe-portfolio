  <rect x="40" y="90" width="460" height="370" rx="8" fill="#0E1624" stroke="rgba(255,255,255,0.1)"/>
  <text x="65" y="125" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">PARCELIFY FREIGHT &amp; INTERSTATE COURIER TRACKING</text>

