  <text x="540" y="120" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="12">DISPATCH EFFICIENCY</text>
  <text x="540" y="170" fill="#10B981" font-family="'Playfair Display', serif" font-size="44" font-weight="bold">-70%</text>
  <text x="540" y="200" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11">Customer Support Calls</text>
  <text x="540" y="225" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">● Automated Waybill Status</text>
  <text x="540" y="245" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">SMS / WhatsApp Alerts</text>

  <rect x="520" y="285" width="240" height="175" rx="8" fill="#0E1624" stroke="rgba(255,255,255,0.1)"/>
  <text x="540" y="315" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="12">OPERATIONAL METRICS</text>
  <rect x="540" y="335" width="200" height="32" rx="4" fill="#162338"/>
  <text x="550" y="355" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">✓ Instant Tariff Calculator</text>
  <rect x="540" y="375" width="200" height="32" rx="4" fill="#162338"/>
  <text x="550" y="395" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">✓ Multi-Branch Manifests</text>
  <text x="540" y="440" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11">Laravel 11 + MySQL Backend</text>
