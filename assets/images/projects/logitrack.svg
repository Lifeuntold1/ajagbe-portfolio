  <text x="80" y="195" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="11">Origin: Abuja Wuse 2 Hub → Destination: Jos Bauchi Road Depot</text>

  <!-- Milestone Steps -->
  <line x1="85" y1="235" x2="85" y2="395" stroke="#1E324A" stroke-width="2"/>
  
  <!-- Step 1 -->
  <circle cx="85" cy="245" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="105" y="242" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">08:45 AM · TODAY</text>
  <text x="105" y="258" fill="#F8FAFC" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600">In Transit — Approaching Plateau Highlands</text>
  <text x="105" y="274" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Driver: S. Danladi · Fleet HiAce #08 · ETA: 01:30 PM</text>

  <!-- Step 2 -->
  <circle cx="85" cy="305" r="5" fill="#38BDF8"/>
  <text x="105" y="302" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="10">05:30 AM · TODAY</text>
  <text x="105" y="318" fill="#F8FAFC" font-family="'DM Sans', sans-serif" font-size="13">Manifest Loaded at Central Sorting Depot</text>

  <!-- Step 3 -->
  <circle cx="85" cy="355" r="5" fill="#38BDF8"/>
  <text x="105" y="352" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="10">04:15 PM · YESTERDAY</text>
  <text x="105" y="368" fill="#F8FAFC" font-family="'DM Sans', sans-serif" font-size="13">Parcel Weighed &amp; Ingested at Abuja Reception</text>

  <!-- Step 4 -->
  <circle cx="85" cy="405" r="5" fill="#94A3B8"/>
  <text x="105" y="405" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Destination Arrival &amp; Delivery OTP Handshake</text>

  <!-- Right: Dispatch Telemetry -->
