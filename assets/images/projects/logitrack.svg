<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090F1A"/>
      <stop offset="100%" stop-color="#0E1B2E"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Browser Header -->
  <rect x="30" y="30" width="740" height="36" rx="6" fill="#14233C" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="55" cy="48" r="5" fill="#EF4444"/>
  <circle cx="72" cy="48" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="48" r="5" fill="#10B981"/>
  <text x="110" y="52" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="12">logitrack.parcelify.internal/route-optimizer</text>

  <!-- Left: GPS Map Simulation -->
  <rect x="40" y="90" width="450" height="370" rx="8" fill="#0B1626" stroke="rgba(255,255,255,0.1)"/>
  <!-- Map Grid Lines -->
  <line x1="40" y1="160" x2="490" y2="160" stroke="#162945" stroke-width="1"/>
  <line x1="40" y1="230" x2="490" y2="230" stroke="#162945" stroke-width="1"/>
  <line x1="40" y1="300" x2="490" y2="300" stroke="#162945" stroke-width="1"/>
  <line x1="40" y1="370" x2="490" y2="370" stroke="#162945" stroke-width="1"/>
  <line x1="130" y1="90" x2="130" y2="460" stroke="#162945" stroke-width="1"/>
  <line x1="220" y1="90" x2="220" y2="460" stroke="#162945" stroke-width="1"/>
  <line x1="310" y1="90" x2="310" y2="460" stroke="#162945" stroke-width="1"/>
  <line x1="400" y1="90" x2="400" y2="460" stroke="#162945" stroke-width="1"/>

  <!-- Route Polyline -->
  <path d="M 90 380 L 160 300 L 250 330 L 330 200 L 420 150" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <!-- Waypoints -->
  <circle cx="90" cy="380" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="105" y="385" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">DEPOT (Lagos Mainland)</text>
  
  <circle cx="160" cy="300" r="6" fill="#38BDF8"/>
  <circle cx="250" cy="330" r="6" fill="#38BDF8"/>
  <circle cx="330" cy="200" r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
  <text x="345" y="205" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11">Active Drop #3</text>

  <circle cx="420" cy="150" r="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
  <text x="360" y="135" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">DESTINATION</text>

  <!-- Route Telemetry HUD -->
  <rect x="60" y="105" width="220" height="45" rx="4" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)"/>
  <text x="75" y="125" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">OPTIMIZED TSP DISTANCE</text>
  <text x="75" y="142" fill="#F8FAFC" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600">38.4 km · 1 hr 14 min ETA</text>

  <!-- Right: Telemetry & Metrics -->
  <rect x="510" y="90" width="250" height="175" rx="8" fill="#0B1626" stroke="#2563EB"/>
  <text x="530" y="120" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="12">FLEET DISPATCH STATUS</text>
  <text x="530" y="170" fill="#10B981" font-family="'Playfair Display', serif" font-size="42" font-weight="bold">99.4%</text>
  <text x="530" y="200" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">On-Time SLA Guarantee</text>
  <text x="530" y="225" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">Active Carriers: 12 Units</text>
  <text x="530" y="245" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Average Stop Delay: 3.2m</text>

  <rect x="510" y="285" width="250" height="175" rx="8" fill="#0B1626" stroke="rgba(255,255,255,0.1)"/>
  <text x="530" y="315" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="12">WAYPOINT VERIFICATION</text>
  <rect x="530" y="335" width="210" height="32" rx="4" fill="#14233C"/>
  <text x="540" y="355" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">✓ Proof-of-Delivery Geofence</text>
  <rect x="530" y="375" width="210" height="32" rx="4" fill="#14233C"/>
  <text x="540" y="395" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">✓ Telemetry Heartbeat 10s</text>
  <text x="530" y="440" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11">● Fuel Burn Saved: -18.6%</text>
</svg>
