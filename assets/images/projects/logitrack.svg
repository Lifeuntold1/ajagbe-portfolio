<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#111B2B"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Browser Header -->
  <rect x="30" y="30" width="740" height="36" rx="6" fill="#162338" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="55" cy="48" r="5" fill="#EF4444"/>
  <circle cx="72" cy="48" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="48" r="5" fill="#10B981"/>
  <text x="110" y="52" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="12">parcelify.ng/track/PCFY-8921-NG</text>

