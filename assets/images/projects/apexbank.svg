<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#141E34"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="30" y="30" width="740" height="36" rx="6" fill="#162340" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="55" cy="48" r="5" fill="#EF4444"/>
  <circle cx="72" cy="48" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="48" r="5" fill="#10B981"/>
  <text x="110" y="52" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="12">apexbank.core.internal/ledger-architecture</text>
  <text x="640" y="52" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="11">● SPRINT 4/6 ACTIVE</text>

  <!-- Left: Core Schema Architecture -->
  <rect x="40" y="90" width="450" height="370" rx="8" fill="#0D162A" stroke="rgba(255,255,255,0.1)"/>
  <text x="65" y="125" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">DOUBLE-ENTRY LEDGER &amp; SETTLEMENT PIPELINE</text>

  <!-- Table 1: Ledger Entries -->
  <rect x="65" y="145" width="400" height="85" rx="6" fill="#162340" stroke="#FBBF24" stroke-width="1"/>
  <text x="80" y="170" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">ledger_entries (Immutable)</text>
  <text x="80" y="195" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">id: UUID · account_id · debit · credit · balance_after</text>
  <text x="80" y="215" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">Strict Zero-Sum: Σ(Debits) == Σ(Credits)</text>

  <!-- Flow Arrow -->
  <path d="M 265 230 L 265 260" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="265,265 260,255 270,255" fill="#FBBF24"/>

  <!-- Table 2: Settlement Isolation -->
  <rect x="65" y="265" width="400" height="85" rx="6" fill="#162340" stroke="rgba(255,255,255,0.1)"/>
  <text x="80" y="290" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">wire_mobilization (ISO 20022)</text>
  <text x="80" y="315" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">id: UUID · swift_bic · iban · currency (USD/EUR/NGN)</text>
  <text x="80" y="335" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">State Machine: INIT → HELD → VERIFIED → SETTLED</text>

  <!-- Bottom Metric -->
  <rect x="65" y="365" width="400" height="75" rx="6" fill="#121C33"/>
  <text x="80" y="390" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">CRYPTOGRAPHIC AUDIT CHAIN</text>
  <text x="80" y="415" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12">SHA-256 Merkle Root verified every 1,000 txns</text>

  <!-- Right: Status & Sprints -->
  <rect x="510" y="90" width="250" height="175" rx="8" fill="#0D162A" stroke="#D97706"/>
  <text x="530" y="120" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="12">DEVELOPMENT PROGRESS</text>
  <text x="530" y="165" fill="#FBBF24" font-family="'Playfair Display', serif" font-size="44" font-weight="bold">72%</text>
  <!-- Progress Bar -->
  <rect x="530" y="180" width="210" height="8" rx="4" fill="#1A2A4C"/>
  <rect x="530" y="180" width="151" height="8" rx="4" fill="url(#goldGrad)"/>
  <text x="530" y="215" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">Core Ledger Engine Complete</text>
  <text x="530" y="240" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">● 100% Deterministic Balance</text>

  <rect x="510" y="285" width="250" height="175" rx="8" fill="#0D162A" stroke="rgba(255,255,255,0.1)"/>
  <text x="530" y="315" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="12">COMPLIANCE CRITERIA</text>
  <rect x="530" y="335" width="210" height="32" rx="4" fill="#162340"/>
  <text x="540" y="355" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">✓ Multi-Currency Partitioning</text>
  <rect x="530" y="375" width="210" height="32" rx="4" fill="#162340"/>
  <text x="540" y="395" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">✓ ISO 20022 Message Parser</text>
  <text x="530" y="440" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="11">Target Release: Q2 2026</text>
</svg>
