  <text x="525" y="175" fill="#34D399" font-family="'Playfair Display', serif" font-size="44" font-weight="bold">94<tspan font-size="20" fill="#9CA3AF">/100</tspan></text>
  <text x="525" y="205" fill="#9CA3AF" font-family="'JetBrains Mono', monospace" font-size="11">Status: High Conversion Readiness</text>
