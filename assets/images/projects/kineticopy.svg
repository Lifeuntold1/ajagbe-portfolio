  <rect x="115" y="405" width="28" height="15" fill="#34D399" rx="2"/>
  <rect x="150" y="370" width="28" height="50" fill="#A855F7" rx="2"/>
  <rect x="185" y="395" width="28" height="25" fill="#38BDF8" rx="2"/>
  <rect x="220" y="410" width="28" height="10" fill="#34D399" rx="2"/>
  <rect x="255" y="365" width="28" height="55" fill="#EC4899" rx="2"/>
  <text x="310" y="400" fill="#9CA3AF" font-family="'JetBrains Mono', monospace" font-size="11">Rhythm: High (Gary Provost rule)</text>

  <!-- Right Column: Scores -->
  <rect x="500" y="90" width="260" height="175" rx="8" fill="#14121F" stroke="#A855F7"/>
