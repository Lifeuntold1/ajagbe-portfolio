  <rect x="500" y="285" width="260" height="175" rx="8" fill="#14121F" stroke="rgba(255,255,255,0.1)"/>
  <text x="525" y="315" fill="#9CA3AF" font-family="'JetBrains Mono', monospace" font-size="12">HEADLINE GENERATION</text>
  <rect x="525" y="335" width="210" height="35" rx="4" fill="#201C31"/>
  <text x="535" y="358" fill="#F3F4F6" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">The Pain + Relief Hook</text>
  <rect x="525" y="380" width="210" height="35" rx="4" fill="#201C31"/>
  <text x="535" y="403" fill="#F3F4F6" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">The Quantified Proof Frame</text>
  <text x="525" y="445" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="11">● 6 Formats Active</text>
