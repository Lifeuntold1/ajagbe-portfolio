  <text x="80" y="305" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11">Flags: delve (-12), unlock (-15), revolutionary (-20)</text>

  <!-- Real-time metrics bar -->
  <rect x="65" y="340" width="390" height="95" rx="6" fill="#171524"/>
  <text x="80" y="365" fill="#E5E7EB" font-family="'JetBrains Mono', monospace" font-size="11">SENTENCE LENGTH CADENCE</text>
