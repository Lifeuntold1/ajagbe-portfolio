  <text x="65" y="125" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">COPY CADENCE &amp; READABILITY AUDITOR</text>
  
  <!-- Content cards -->
  <rect x="65" y="145" width="390" height="70" rx="6" fill="#1C192B" stroke="#A855F7" stroke-width="1"/>
