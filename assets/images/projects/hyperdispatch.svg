<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101C"/>
      <stop offset="100%" stop-color="#121D34"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="30" y="30" width="740" height="36" rx="6" fill="#172746" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="55" cy="48" r="5" fill="#EF4444"/>
  <circle cx="72" cy="48" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="48" r="5" fill="#10B981"/>
  <text x="110" y="52" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="12">hyperdispatch.parcelify.internal/route-clustering</text>
  <text x="640" y="52" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="11">● SPRINT 2/5 ACTIVE</text>

  <!-- Left: GIS TSP Clustering Diagram -->
  <rect x="40" y="90" width="450" height="370" rx="8" fill="#0D172B" stroke="rgba(255,255,255,0.1)"/>
  <text x="65" y="125" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">AUTONOMOUS MULTI-DEPOT CLUSTERING &amp; TSP SOLVER</text>

  <!-- Cluster A -->
  <circle cx="160" cy="220" r="70" fill="rgba(79, 70, 229, 0.15)" stroke="#6366F1" stroke-dasharray="4 4"/>
  <circle cx="160" cy="220" r="6" fill="#6366F1"/>
  <circle cx="130" cy="190" r="4" fill="#A5B4FC"/>
  <circle cx="190" cy="200" r="4" fill="#A5B4FC"/>
  <circle cx="150" cy="250" r="4" fill="#A5B4FC"/>
  <text x="120" y="140" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="10">Cluster 01 (Ikeja Hub)</text>

  <!-- Cluster B -->
  <circle cx="340" cy="240" r="65" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-dasharray="4 4"/>
  <circle cx="340" cy="240" r="6" fill="#06B6D4"/>
  <circle cx="320" cy="210" r="4" fill="#67E8F9"/>
  <circle cx="360" cy="220" r="4" fill="#67E8F9"/>
  <circle cx="330" cy="270" r="4" fill="#67E8F9"/>
  <text x="290" y="160" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="10">Cluster 02 (Lekki Hub)</text>

  <!-- Inter-cluster link -->
  <path d="M 160 220 Q 250 170 340 240" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="220" y="195" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="9">Dynamic Transfer</text>

  <!-- Performance metrics -->
  <rect x="65" y="325" width="400" height="110" rx="6" fill="#142340"/>
  <text x="80" y="350" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">HIGH-DENSITY BATCH OPTIMIZATION BENCHMARK</text>
  <text x="80" y="375" fill="#818CF8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600">4,000 Waypoints Solved in 680ms (Lin-Kernighan Heuristic)</text>
  <text x="80" y="400" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Real-Time Traffic Rerouting Trigger: Latency &lt; 250ms</text>
  <text x="80" y="420" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">Projected Fleet Mileage Reduction: 23.4%</text>

  <!-- Right: Status Panel -->
  <rect x="510" y="90" width="250" height="175" rx="8" fill="#0D172B" stroke="#4F46E5"/>
  <text x="530" y="120" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="12">DEVELOPMENT PROGRESS</text>
  <text x="530" y="165" fill="#818CF8" font-family="'Playfair Display', serif" font-size="44" font-weight="bold">45%</text>
  <!-- Progress Bar -->
  <rect x="530" y="180" width="210" height="8" rx="4" fill="#172746"/>
  <rect x="530" y="180" width="94" height="8" rx="4" fill="url(#indigoGrad)"/>
  <text x="530" y="215" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">Heuristic Benchmark Active</text>
  <text x="530" y="240" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="11">● K-Means + TSP Simulated</text>

  <rect x="510" y="285" width="250" height="175" rx="8" fill="#0D172B" stroke="rgba(255,255,255,0.1)"/>
  <text x="530" y="315" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="12">ARCHITECTURAL TARGETS</text>
  <rect x="530" y="335" width="210" height="32" rx="4" fill="#172746"/>
  <text x="540" y="355" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">✓ Multi-Depot Fleet Partitioning</text>
  <rect x="530" y="375" width="210" height="32" rx="4" fill="#172746"/>
  <text x="540" y="395" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">✓ In-Memory Spatial R-Tree Index</text>
  <text x="530" y="440" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">Target Release: Q3 2026</text>
</svg>
